<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Police/DCI Dashboard – Salama Digital</title>
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0D2757', orange: '#F27C22', leaf: '#56B847', deepGreen: '#146C2E', surface: '#F8FAFC',
          }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
</head>

<body class="font-sans bg-[#F8FAFC] text-[#0D2757] min-h-screen flex">
  <div id="salama-shell" class="min-h-screen w-full flex"></div>

  <template id="page-content">
    <div class="space-y-6">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-1">Beyond Reporting ·
            Institutional Partner</p>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-[#0D2757] tracking-tight flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-[#0D2757] flex items-center justify-center shrink-0">
              <i data-lucide="shield" class="w-5 h-5 text-[#56B847]"></i>
            </span>
            Institutional Workspace: National Police Service / DCI
          </h1>
          <p class="mt-1.5 text-sm text-slate-500">Gender Desks &amp; DCI — de-identified operational metrics, Mombasa
            &amp; Kilifi.</p>
        </div>
        <span
          class="inline-flex items-center gap-1.5 self-start px-3 py-1.5 rounded-full bg-[#0D2757]/5 border border-[#0D2757]/10 text-xs font-semibold text-[#0D2757]">
          <span id="period-badge" class="w-2 h-2 rounded-full bg-[#56B847] animate-pulse"></span>
          <span>Live aggregate feed</span>
        </span>
      </div>

      <!-- Data Disclaimer Banner (critical alert styling: orange) -->
      <div class="rounded-xl border border-[#F27C22]/40 bg-[#F27C22]/10 px-5 py-4 flex items-start gap-3" role="alert">
        <i data-lucide="shield-alert" class="w-5 h-5 text-[#F27C22] shrink-0 mt-0.5"></i>
        <div>
          <p class="text-sm font-bold text-[#0D2757]">Restricted View: Aggregate operational metrics only.</p>
          <p class="text-xs text-slate-600 mt-0.5">No individual survivor data is accessible from this workspace. All
            figures are de-identified counts aggregated per institutional mandate.</p>
        </div>
      </div>

      <!-- Metric Cards (static MVP data) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cases Reported (Current
              Quarter)</span>
            <i data-lucide="file-text" class="w-4 h-4 text-[#0D2757]/40"></i>
          </div>
          <p class="mt-2 text-3xl font-extrabold text-[#0D2757]" data-metric="casesReported">—</p>
          <p class="mt-1 text-[11px] text-slate-400">Gender Desk abstraction feed</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">P3 Forms Issued</span>
            <i data-lucide="file-check-2" class="w-4 h-4 text-[#0D2757]/40"></i>
          </div>
          <p class="mt-2 text-3xl font-extrabold text-[#0D2757]" data-metric="p3FormsIssued">—</p>
          <p class="mt-1 text-[11px] text-slate-400">Police Form P3 completion</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Referrals to GBVRC /
              Health</span>
            <i data-lucide="heart-pulse" class="w-4 h-4 text-[#0D2757]/40"></i>
          </div>
          <p class="mt-2 text-3xl font-extrabold text-[#0D2757]" data-metric="referralsToHealth">—</p>
          <p class="mt-1 text-[11px] text-slate-400">Initiated referral pathway count</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Pending Investigations</span>
            <i data-lucide="hourglass" class="w-4 h-4 text-[#F27C22]"></i>
          </div>
          <p class="mt-2 text-3xl font-extrabold text-[#F27C22]" data-metric="pendingInvestigations">—</p>
          <p class="mt-1 text-[11px] text-slate-400">Open, P3 not yet issued</p>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <h2 class="text-sm font-bold text-[#0D2757] flex items-center gap-2">
            <i data-lucide="bar-chart-3" class="w-4 h-4 text-[#0D2757]/50"></i>
            Reported Offence Categories
          </h2>
          <div id="chart-categories" class="mt-4 space-y-3" aria-label="Bar chart: reported offence categories"></div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <h2 class="text-sm font-bold text-[#0D2757] flex items-center gap-2">
            <i data-lucide="pie-chart" class="w-4 h-4 text-[#0D2757]/50"></i>
            Referral Completion Rate
          </h2>
          <div id="chart-completion" class="mt-4 flex items-center justify-center gap-8"
            aria-label="Donut chart: referral completion"></div>
        </div>
      </div>

      <!-- Recent Referral Pathways -->
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="text-sm font-bold text-[#0D2757] flex items-center gap-2">
            <i data-lucide="git-branch" class="w-4 h-4 text-[#0D2757]/50"></i>
            Recent Referral Pathways
          </h2>
          <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">No names · No identifiers</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr
                class="text-left text-[11px] uppercase tracking-wider text-slate-400 bg-[#F8FAFC] border-b border-slate-100">
                <th class="px-5 py-3 font-bold">Referral ID</th>
                <th class="px-5 py-3 font-bold">Date Initiated</th>
                <th class="px-5 py-3 font-bold">Destination Institution</th>
                <th class="px-5 py-3 font-bold">Status</th>
              </tr>
            </thead>
            <tbody id="referral-rows" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <script src="/app/js/shell.js"></script>
  <script>
    (async function () {
      window.initSalamaShell({ activeId: 'dashboard-police', breadcrumb: 'Police/DCI Dashboard' });
      document.querySelector('main').innerHTML = document.getElementById('page-content').innerHTML;
      lucide.createIcons();

      // This page is for police_dci_focal_person accounts only.
      const me = await fetch('/api/auth/me', { credentials: 'same-origin' }).then((r) => (r.ok ? r.json() : null));
      if (!me || me.role !== 'police_dci_focal_person') { window.location.href = '/app/login.html'; return; }

      const data = await fetch('/api/institutional-metrics', { credentials: 'same-origin' }).then((r) => r.json()).catch(() => null);
      if (!data || data.mandate !== 'police') { window.location.href = '/app/login.html'; return; }

      const set = (k, v) => { const el = document.querySelector(`[data-metric="${k}"]`); if (el) el.textContent = v; };
      set('casesReported', data.metrics.casesReported);
      set('p3FormsIssued', data.metrics.p3FormsIssued);
      set('referralsToHealth', data.metrics.referralsToHealth);
      set('pendingInvestigations', data.metrics.pendingInvestigations);

      // Bar chart: reported offence categories
      const cats = data.reportedOffenceCategories || [];
      const max = Math.max(1, ...cats.map((c) => c.cases));
      const COLORS = ['#0D2757', '#F27C22', '#56B847', '#146C2E', '#64748b', '#94a3b8'];
      document.getElementById('chart-categories').innerHTML = cats.length ? cats.map((c, i) => `
        <div>
          <div class="flex justify-between text-xs mb-1"><span class="font-semibold text-[#0D2757]">${c.category}</span><span class="text-slate-500">${c.cases}</span></div>
          <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden">
            <div class="h-full rounded-full" style="width:${Math.round((c.cases / max) * 100)}%;background:${COLORS[i % COLORS.length]}"></div>
          </div>
        </div>`).join('') : '<p class="text-sm text-slate-400">No abstraction records for this period.</p>';

      // Donut chart: referral completion
      const done = data.referralCompletion?.completed ?? 0, notDoc = data.referralCompletion?.notDocumented ?? 0;
      const total = Math.max(1, done + notDoc);
      const pct = Math.round((done / total) * 100);
      document.getElementById('chart-completion').innerHTML = `
        <svg viewBox="0 0 120 120" class="w-40 h-40 -rotate-90">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#e2e8f0" stroke-width="16"/>
          <circle cx="60" cy="60" r="50" fill="none" stroke="#56B847" stroke-width="16"
                  stroke-dasharray="${(done / total) * 314} 314" stroke-linecap="round"/>
        </svg>
        <div class="space-y-2 text-sm">
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#56B847]"></span><span class="font-semibold text-[#0D2757]">Completed</span><span class="text-slate-500">${done}</span></div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-200"></span><span class="font-semibold text-[#0D2757]">Not Documented</span><span class="text-slate-500">${notDoc}</span></div>
          <p class="text-2xl font-extrabold text-[#0D2757] pt-1">${pct}%</p>
        </div>`;

      // Referral pathway table
      const rows = data.recentReferralPathways || [];
      document.getElementById('referral-rows').innerHTML = rows.length ? rows.map((r) => `
        <tr class="hover:bg-[#F8FAFC]">
          <td class="px-5 py-3 font-mono text-xs text-slate-500">${r.referralId}</td>
          <td class="px-5 py-3 text-[#0D2757]">${r.dateInitiated}</td>
          <td class="px-5 py-3 text-[#0D2757]">${r.destinationInstitution}</td>
          <td class="px-5 py-3">
            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${r.status === 'Completed' ? 'bg-[#56B847]/15 text-[#146C2E]' : 'bg-[#F27C22]/15 text-[#b3550f]'}">${r.status}</span>
          </td>
        </tr>`).join('') : '<tr><td colspan="4" class="px-5 py-6 text-sm text-slate-400 text-center">No referral pathways recorded.</td></tr>';
    })();
  </script>
</body>

</html>
